version: '3.9'
services:
  mongo:
    image: mongo:6.0
    container_name: notesapp_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: notesapp
    volumes:
      - ./mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - notes-net

  mongo-express:
    image: mongo-express:1.0.0
    container_name: notesapp_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - "8081:8081"
    networks:
      - notes-net

networks:
  notes-net:
    driver: bridge
