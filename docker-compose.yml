version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: notesapp_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: notesapp
      MYSQL_USER: notesapp
      MYSQL_PASSWORD: notesapp
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - notes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: markei_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://notesapp:notesapp@mysql:3306/notesapp"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - notes-net

  adminer:
    image: adminer:latest
    container_name: notesapp_adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - notes-net

networks:
  notes-net:
    driver: bridge
